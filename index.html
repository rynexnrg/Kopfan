
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kopf an</title>

  <style>
    * {
      box-sizing: border-box;
      color: #000;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at 12% 8%, #e5eee8 0%, transparent 42%),
        radial-gradient(ellipse at 90% 90%, #a8c4b7 0%, transparent 44%),
        #cbdcd2;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 23px 7%;
      background: rgba(244, 249, 245, 0.35);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -1.2px;
    }

    .logo-mark {
      width: 29px;
      height: 29px;
      border: 2px solid #000;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 700;
      transform: rotate(-5deg);
    }

    .logo-name {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .logo-name span:last-child {
      font-weight: 400;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    nav button {
      border: none;
      background: transparent;
      padding: 8px 0;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    nav button:hover {
      opacity: 0.55;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 110px 7% 80px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 66px);
      line-height: 1.08;
      letter-spacing: -2px;
      margin: 0 0 28px;
      font-weight: 700;
    }

    .welcome {
      max-width: 680px;
      font-size: 18px;
      line-height: 1.9;
      margin: 0;
    }

    .clickable {
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .clickable:hover {
      opacity: 0.55;
    }

    /* Pop-up */

    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(24, 34, 29, 0.22);
      backdrop-filter: blur(5px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .popup-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .popup {
      width: 100%;
      max-width: 370px;
      padding: 27px;
      background: #eef4ef;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(28, 43, 34, 0.16);
      transform: translateY(12px) scale(0.97);
      opacity: 0;
      transition:
        transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
        opacity 0.2s ease;
    }

    .popup-overlay.open .popup {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .popup-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .popup h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .popup-close {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.055);
      font-size: 21px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.18s, transform 0.18s;
    }

    .popup-close:hover {
      background: rgba(0, 0, 0, 0.11);
      transform: rotate(90deg);
    }

    .popup p {
      margin: 0 0 25px;
      font-size: 15px;
      line-height: 1.75;
    }

    .close-button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #d5e3d9;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.18s, transform 0.18s;
    }

    .close-button:hover {
      background: #c5d8cb;
    }

    .close-button:active {
      transform: scale(0.98);
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 6%;
        flex-wrap: wrap;
        gap: 18px;
      }

      .logo {
        font-size: 23px;
      }

      nav {
        gap: 22px;
      }

      main {
        padding: 75px 6% 60px;
      }

      .welcome {
        font-size: 16px;
      }

      .popup {
        padding: 23px;
        border-radius: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <div class="logo-mark">K</div>
      <div class="logo-name">
        <span>Kopf</span>
        <span>an</span>
      </div>
    </div>

    <nav>
      <button type="button" onclick="openPopup('impressum')">
        Impressum
      </button>
      <button type="button" onclick="openPopup('hilfe')">
        Hilfe
      </button>
    </nav>
  </header>

  <main id="start">
    <h1>Willkommen im Rätselraum.</h1>

    <p class="welcome">
      Willkommen im Rätselraum. Hier findest du verschiedene Rätsel
      und versteckte Hinweise. Schau dich in Ruhe um und achte auf
      die Details. Manchmal lohnt es sich, genauer hinzusehen –
      denn irgendwo geht es bestimmt
      <span class="clickable" onclick="weiter()">weiter</span>
    </p>
  </main>

  <div class="popup-overlay" id="popupOverlay"
       onclick="closePopupOutside(event)">
    <section class="popup" role="dialog" aria-modal="true"
             aria-labelledby="popupTitle">
      <div class="popup-top">
        <h2 id="popupTitle"></h2>
        <button class="popup-close" type="button"
                aria-label="Schließen" onclick="closePopup()">×</button>
      </div>

      <p id="popupText"></p>

      <button class="close-button" type="button" onclick="closePopup()">
        Schließen
      </button>
    </section>
  </div>

  <script>
    const overlay = document.getElementById("popupOverlay");
    const popupTitle = document.getElementById("popupTitle");
    const popupText = document.getElementById("popupText");

    function openPopup(type) {
      if (type === "impressum") {
        popupTitle.textContent = "Impressum";
        popupText.textContent =
          "Kein Plan, was hier stehen muss. Ich habe die Webseite gemacht.";
      } else {
        popupTitle.textContent = "Hilfe";
        popupText.textContent =
          "Tipp: Lies alles durch und suche einen Knopf.";
      }

      overlay.classList.add("open");
    }

    function closePopup() {
      overlay.classList.remove("open");
    }

    function closePopupOutside(event) {
      if (event.target === overlay) {
        closePopup();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        closePopup();
      }
    });

    function weiter() {
      window.location.href = "raetsel1.html";
    }
  </script>
</body>
</html>
